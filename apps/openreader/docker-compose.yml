services:
  openreader:
    image: ghcr.io/richardr1126/openreader:v5.1.0
    container_name: openreader
    restart: unless-stopped
    environment:
      PUID: ${APP_PUID}
      PGID: ${APP_PGID}
      TZ: ${HOST_TZ}
      BASE_URL: ${OPENREADER_BASE_URL}
      AUTH_SECRET: ${OPENREADER_AUTH_SECRET}
      BOOTSTRAP_ADMIN_EMAIL: ${OPENREADER_BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${OPENREADER_BOOTSTRAP_ADMIN_PASSWORD}
      USE_ANONYMOUS_AUTH_SESSIONS: ${OPENREADER_USE_ANONYMOUS_AUTH_SESSIONS}
      COMPUTE_WORKER_HOST: ${OPENREADER_COMPUTE_WORKER_HOST}
      COMPUTE_WORKER_PUBLIC_URL: ${OPENREADER_COMPUTE_WORKER_PUBLIC_URL}
      TTS_PLAYBACK_TOKEN_SECRET: ${OPENREADER_TTS_PLAYBACK_TOKEN_SECRET}
      API_BASE: ${OPENREADER_TTS_API_BASE}
      API_KEY: ${OPENREADER_TTS_API_KEY}
      API_MODEL_NAME: ${OPENREADER_TTS_API_MODEL_NAME}
      RUNTIME_SEED_JSON: '${OPENREADER_RUNTIME_SEED_JSON}'
      WEED_MINI_WAIT_SEC: ${OPENREADER_WEED_MINI_WAIT_SEC:-90}
    volumes:
      - ${OPENREADER_CONFIG_MOUNT_DIR}:/app/config
      - ${OPENREADER_DATA_MOUNT_DIR}:/app/docstore
    ports:
      - ${OPENREADER_WEB_PORT}:3003
      - ${OPENREADER_PLAYBACK_PORT}:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
