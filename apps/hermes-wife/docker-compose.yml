services:
  hermes-wife-agent:
    image: nousresearch/hermes-agent:v2026.7.7.2
    container_name: hermes-wife-agent
    restart: unless-stopped
    command: gateway run
    ports:
      - "${WIFE_HERMES_PORT}:8642"
      - "${WIFE_HERMES_DASHBOARD_PORT}:9119"
    volumes:
      - "${WIFE_HERMES_HOST_DATA_DIR}:/opt/data"
    environment:
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${WIFE_HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${WIFE_HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${WIFE_TELEGRAM_BOT_TOKEN}
      OPENAI_API_BASE: ${WIFE_OPENAI_API_BASE}
      OPENAI_API_KEY: ${WIFE_OPENAI_API_KEY}
      REDIS_HOST: hermes-wife-redis-cache
      REDIS_PORT: 6379
    depends_on:
      - hermes-wife-redis-cache

  hermes-wife-redis-cache:
    image: redis:7-alpine
    container_name: hermes-wife-redis-cache
    restart: unless-stopped
    ports:
      - "6379"
