services:
  ollama:
    image: ollama/ollama:0.32.6
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
    volumes:
      - ${OLLAMA_MOUNT_DIR}:/root/.ollama
    ports:
      - ${OLLAMA_WEB_PORT}:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
